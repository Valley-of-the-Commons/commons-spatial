      <rect x="68" y="4" width="30" height="100" fill="#111a16" stroke="#6FD9A2" stroke-width="1.5"/><rect x="102" y="4" width="30" height="100" fill="#111a16" stroke="#6FD9A2" stroke-width="1.5"/>
