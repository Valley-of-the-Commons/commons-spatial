  <text x="34" y="140" font-size="12" letter-spacing="2.1" fill="#9AA79C">TOP DOWN · AIR RUNS FRONT TO BACK</text>

  <rect x="34" y="152" width="952" height="330" rx="6" fill="#0d1310" stroke="#3a4440" stroke-width="1.5"/>
  <text x="46" y="172" font-size="9" letter-spacing="0.7" fill="#9AA79C">FRONT</text>
  <text x="934" y="172" font-size="9" letter-spacing="0.7" fill="#9AA79C">REAR</text>

