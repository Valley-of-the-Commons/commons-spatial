      <circle cx="52" cy="106" r="15" fill="#141024" stroke="#A594E8" stroke-width="1.5"/><circle cx="52" cy="146" r="15" fill="#141024" stroke="#A594E8" stroke-width="1.5"/>
      <circle cx="52" cy="186" r="15" fill="#141024" stroke="#A594E8" stroke-width="1.5"/>
    </g>
  </g>

  <!-- airflow -->

