    <text x="340" y="11" font-size="9" letter-spacing="0.7" fill="#9AA79C">UNKNOWN OR UNREAD</text>
    <rect x="500" y="0" width="13" height="13" fill="#141024" stroke="#A594E8" stroke-width="1.5"/>
    <text x="520" y="11" font-size="9" letter-spacing="0.7" fill="#9AA79C">COOLING / AIRFLOW</text>
  </g>

