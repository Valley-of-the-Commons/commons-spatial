<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 682" width="1020" height="682"
     font-family="ui-monospace, SFMono-Regular, Menlo, monospace" role="img"
     aria-label="Top-down and front layout of the Hub server, inferred from the walk-around recordings">
  <title>The Hub server, as far as we know it</title>
  <desc>Inferred layout. Solid outlines are things seen on camera; dashed outlines are unknown or unread.</desc>


  <rect width="1020" height="682" fill="#060A07"/>

  <text x="34" y="42" font-size="17" letter-spacing="0.3" fill="#EDE7D7">The Hub server, as far as we know it</text>
  <text x="34" y="62" font-size="9" letter-spacing="0.7" fill="#9AA79C">INFERRED FROM SIX RECORDINGS · NOTHING HERE HAS BEEN VERIFIED WITH THE LID OFF</text>

  <!-- ─── legend ─────────────────────────────────────────────── -->
  <g transform="translate(34,84)">
    <rect x="0"   y="0" width="13" height="13" fill="#111a16" stroke="#6FD9A2" stroke-width="1.5"/>
    <text x="20"  y="11" font-size="9" letter-spacing="0.7" fill="#9AA79C">SEEN ON CAMERA</text>
    <rect x="150" y="0" width="13" height="13" fill="#14100a" stroke="#F5B95A" stroke-width="1.5"/>
    <text x="170" y="11" font-size="9" letter-spacing="0.7" fill="#9AA79C">STATED, UNVERIFIED</text>
